name: opsis_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.8+9

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
  image: ^4.1.3
  lucide_icons: ^0.257.0
  mailer: ^7.1.0
  package_info_plus: ^10.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  printing: ^5.14.3
  shadcn_ui: ^0.54.0
  sembast: ^3.7.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic
